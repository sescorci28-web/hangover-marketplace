<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Catálogo – Hangover Marketplace</title>
<meta name="description" content="Explora el catálogo completo de Hangover. Alquila o compra equipos de sonido, decoraciones, catering, mobiliario e iluminación para tu fiesta.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="catalog">

<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="logo-link">
      <img src="images/logo.png" alt="Hangover" class="logo-img" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span class="logo-text">HANGOVER</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="catalog.html" class="active">Catálogo</a></li>
      <li><a href="index.html#como-funciona">Cómo funciona</a></li>
      <li><a href="index.html#contacto">Contacto</a></li>
    </ul>
    <div class="nav-right">
      <a href="login.html" class="btn btn-ghost nav-login-btn">Iniciar sesión</a>
      <a href="cart.html" class="cart-btn">🛒 Carrito <span class="cart-badge">0</span></a>
    </div>
  </div>
</nav>

<div class="page-header">
  <div class="page-header-inner">
    <h1>🎉 Catálogo de productos</h1>
    <p>Todo lo que necesitas para tu fiesta perfecta en un solo lugar</p>
  </div>
</div>

<div class="catalog-layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="filter-group">
      <h3>Categorías</h3>
      <div class="filter-cats" id="filter-cats"></div>
    </div>
    <div class="filter-group">
      <label>Tipo</label>
      <select class="field-select" id="filter-type">
        <option value="all">Todos</option>
        <option value="rental">Solo alquiler</option>
        <option value="purchase">Solo compra</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Ordenar por</label>
      <select class="field-select" id="sort-select">
        <option value="rating">Mejor calificados</option>
        <option value="reviews">Más reseñas</option>
        <option value="price-asc">Precio: menor a mayor</option>
        <option value="price-desc">Precio: mayor a menor</option>
      </select>
    </div>
  </aside>

  <!-- MAIN -->
  <main>
    <div class="catalog-toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Buscar productos...">
      </div>
      <span class="results-info" id="results-info"></span>
    </div>
    <div class="products-grid" id="catalog-grid"></div>
    <div class="pagination" id="pagination"></div>
  </main>
</div>

<footer class="mini-footer">
  © 2026 Hangover Marketplace · <a href="index.html" class="mini-footer-link">Volver al inicio</a>
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/app.js"></script>
</body>
</html>
