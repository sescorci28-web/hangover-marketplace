<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Producto – Hangover Marketplace</title>
<meta name="description" content="Detalle del producto en Hangover Marketplace.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="product">

<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="logo-link">
      <img src="images/logo.png" alt="Hangover" class="logo-img" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span class="logo-text">HANGOVER</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="catalog.html" class="active">Catálogo</a></li>
    </ul>
    <div class="nav-right">
      <a href="login.html" class="btn btn-ghost" style="padding: 8px 16px; font-size: 14px;">Iniciar sesión</a>
      <a href="cart.html" class="cart-btn">🛒 Carrito <span class="cart-badge">0</span></a>
    </div>
  </div>
</nav>

<div style="padding:20px 5%;max-width:1280px;margin:auto">
  <a href="catalog.html" style="color:var(--txt2);font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:var(--tr)" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--txt2)'">← Volver al catálogo</a>
</div>

<div class="pd-wrap" id="product-wrap">
  <div style="color:var(--txt2);padding:48px;text-align:center;grid-column:1/-1">Cargando producto…</div>
</div>

<!-- RELATED -->
<section style="padding:60px 5% 80px">
  <div style="max-width:1280px;margin:auto">
    <div class="section-head">
      <div class="section-tag">Relacionados</div>
      <h2 class="section-title">También te puede interesar</h2>
    </div>
    <div class="products-grid" id="related-grid"></div>
  </div>
</section>

<footer style="background:var(--bg2);border-top:1px solid var(--border);padding:24px 5%;text-align:center;color:var(--txt2);font-size:13px">
  © 2026 Hangover Marketplace · <a href="index.html" style="color:var(--purple)">Volver al inicio</a>
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/app.js"></script>
</body>
</html>
